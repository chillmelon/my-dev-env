# Sourced by systemd --user AND by /usr/local/bin/sway-nvidia (sh, set -a).
# Qt apps follow the GTK theme (Adwaita-dark) via qt{5,6}-gtk-platformtheme.
QT_QPA_PLATFORMTHEME=gtk3
# Keep in sync with `seat` in sway/config.d/30-theme.conf and gsettings cursor-theme.
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24
