output * bg $bg solid_color
# Image wallpapers (kept in ~/Pictures/Wallpapers), e.g.:
#   output $fm bg ~/Pictures/Wallpapers/beach-waves-rocks.jpg fill
#   output $sm bg ~/Pictures/Wallpapers/rocky-island-waves.png fill

# Dual monitor: primary on the left, secondary on the right (both landscape).
# Names come from `swaymsg -t get_outputs`.
output $fm mode 1920x1080@60Hz position 0 0
output $sm mode 1920x1080@60Hz position 1920 0
