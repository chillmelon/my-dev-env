for_window [window_role="pop-up"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_type="dialog"] floating enable
for_window [app_id="(?i)pavucontrol"] floating enable
for_window [app_id="(?i)telegram"] floating enable
for_window [class="(?i)telegram" title="^(?!Media viewer$)"] floating enable
# Telegram lives on workspace 3; it re-maps its window when activated (e.g. notification click),
# so pin every (re)map back to 3 instead of letting it land on the current workspace.
# --no-auto-back-and-forth: with workspace_auto_back_and_forth on, "move to 3" while already
# on 3 would otherwise send the window to the previous workspace. Use it on every such rule.
# Follow the window there: a plain "focus"/"workspace" inside for_window is undone when sway
# finishes mapping the window, so focus it afterwards via exec (async).
# Pattern for any app pinned to a workspace (criteria without spaces/quotes inside exec):
#   for_window [app_id="foo"] move --no-auto-back-and-forth container to workspace number N, exec swaymsg [app_id=foo] focus
for_window [app_id="(?i)telegram" title="^(?!Media viewer$)"] move --no-auto-back-and-forth container to workspace number 3, exec ~/.config/sway/scripts/telegram.sh focus
for_window [class="(?i)telegram" title="^(?!Media viewer$)"] move --no-auto-back-and-forth container to workspace number 3, exec ~/.config/sway/scripts/telegram.sh focus
for_window [app_id="(?i)satty"] floating enable

# Don't idle-lock / blank while any window is fullscreen (videos, games)
for_window [app_id=".*"] inhibit_idle fullscreen
for_window [class=".*"] inhibit_idle fullscreen
