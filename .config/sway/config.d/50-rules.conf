for_window [window_role="pop-up"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_type="dialog"] floating enable
for_window [app_id="(?i)pavucontrol"] floating enable
for_window [app_id="(?i)telegram"] floating enable
for_window [class="(?i)telegram" title="^(?!Media viewer$)"] floating enable
for_window [app_id="(?i)satty"] floating enable

# Don't idle-lock / blank while any window is fullscreen (videos, games)
for_window [app_id=".*"] inhibit_idle fullscreen
for_window [class=".*"] inhibit_idle fullscreen
