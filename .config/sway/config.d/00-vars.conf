set $mod Mod4
set $mod1 Mod1

# Monitors: $fm = primary (workspaces 1-10), $sm = secondary (11-19)
set $fm HDMI-A-1
set $sm DVI-D-1

set $left h
set $down j
set $up k
set $right l
set $term ghostty
set $menu fuzzel
# Colors/background come from ~/.config/swaylock/config
set $lock swaylock -f

# Palette: Nord, "Nordic minimal" — greyscale + ONE accent (frost),
# aurora colors only for states. https://www.nordtheme.com/docs/colors-and-palettes
# Same values in waybar/style.css, fuzzel/fuzzel.ini, mako/config, swaylock/config.
set $bg       #2e3440
set $surface  #3b4252
set $text     #d8dee9
set $accent   #88c0d0
set $red      #bf616a
