exec swayidle -w \
    timeout 300 '$lock' \
    timeout 600 'swaymsg "output * power off"' \
        resume 'swaymsg "output * power on"' \
    before-sleep '$lock' \
    lock '$lock'

# Automatically choose horizontal/vertical splits; avoid duplicates on reload.
exec_always sh -c 'pgrep -u "$(id -u)" -x autotiling >/dev/null || exec autotiling'

exec fcitx5 -d

# Graphical polkit agent (password prompts for nm-connection-editor, disks, updates...)
exec /usr/libexec/polkit-mate-authentication-agent-1

# Clipboard history daemon (exec_always + pgrep so it starts on reload after installing cliphist)
exec_always sh -c 'command -v cliphist >/dev/null && ! pgrep -f "^wl-paste --watch cliphist" >/dev/null && exec wl-paste --watch cliphist store'

# Keep clipboard contents after the source app closes (built via: cargo install --git https://github.com/Linus789/wl-clip-persist)
exec_always sh -c 'pgrep -u "$(id -u)" -x wl-clip-persist >/dev/null || exec ~/.cargo/bin/wl-clip-persist --clipboard regular'

# Notification daemon. swaync config is kept in ~/.config/swaync (swaync.service is masked:
# `systemctl --user unmask swaync` before switching back, or swaync-client would be unusable).
exec mako
