exec swayidle -w \
    timeout 300 '$lock' \
    timeout 600 'swaymsg "output * power off"' \
        resume 'swaymsg "output * power on"' \
    before-sleep '$lock' \
    lock '$lock'

exec fcitx5 -d

# Graphical polkit agent (password prompts for nm-connection-editor, disks, updates...)
exec /usr/libexec/polkit-mate-authentication-agent-1

# Clipboard history daemon (exec_always + pgrep so it starts on reload after installing cliphist)
exec_always sh -c 'command -v cliphist >/dev/null && ! pgrep -f "[w]l-paste --watch cliphist" >/dev/null && exec wl-paste --watch cliphist store'

exec mako
