font pango:Noto Sans CJK TC 10
default_border pixel 2
default_floating_border pixel 2
gaps inner 8
smart_gaps off
hide_edge_borders smart

# Cursor (also sets XCURSOR_THEME/SIZE for apps sway launches).
# Keep in sync with ~/.config/environment.d/80-desktop.conf, gtk-*/settings.ini, gsettings.
seat * xcursor_theme Adwaita 24

# class                 border  bg      text    indicator child_border
# Palette in 00-vars.conf
client.focused          $accent  $accent $bg    $accent   $accent
client.unfocused        $surface $bg     $text  $surface  $surface
client.focused_inactive $surface $bg     $text  $surface  $surface
client.urgent           $red     $red    $bg    $red      $red

# Waybar: ~/.config/waybar/{config.jsonc,style.css}
bar {
    swaybar_command waybar
}
