# Push this session's env to systemd/D-Bus, then restart portals.
# The systemd user manager outlives logouts, so portals otherwise keep a dead
# display from the previous session and GTK4 apps (ghostty) hang at startup.
#
# IM/theme/cursor vars are re-pushed too: a GNOME login leaves ibus values
# (QT_IM_MODULES=wayland;ibus, ...) in the user manager. Sway itself gets the
# right values from ~/.config/environment.d/*.conf via /usr/local/bin/sway-nvidia.
exec sh -c 'dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_SESSION_TYPE XDG_SESSION_DESKTOP XDG_CURRENT_DESKTOP=sway:wlroots GTK_IM_MODULE QT_IM_MODULE QT_IM_MODULES XMODIFIERS QT_QPA_PLATFORMTHEME XCURSOR_THEME XCURSOR_SIZE; systemctl --user restart xdg-desktop-portal-gtk xdg-desktop-portal-wlr xdg-desktop-portal'
