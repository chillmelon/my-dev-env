[main]
font=BlexMono Nerd Font:size=12,Noto Sans CJK TC:size=12
prompt="❯ "
icon-theme=Yaru-dark
icons-enabled=yes
terminal=ghostty -e
layer=overlay
anchor=center
# sway focus-follows-mouse steals keyboard focus as soon as the pointer moves,
# which would close fuzzel (e.g. right after clicking the waybar power button).
# Esc still closes it.
exit-on-keyboard-focus-loss=no
width=40
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=8
line-height=22
fields=name,generic,keywords

[colors]
# Nord, Nordic minimal: greyscale + frost accent (RRGGBBAA)
background=2e3440f2
text=d8dee9ff
prompt=88c0d0ff
placeholder=4c566aff
input=eceff4ff
match=88c0d0ff
selection=3b4252ff
selection-text=eceff4ff
selection-match=88c0d0ff
counter=4c566aff
border=4c566aff

[border]
width=1
radius=6
