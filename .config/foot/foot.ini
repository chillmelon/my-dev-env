# -*- conf -*-
# foot config — mirrors ~/.config/ghostty/config.ghostty
# (TokyoNight Storm, BlexMono Nerd Font Mono 12, translucent bg)

[main]
font=BlexMono Nerd Font Mono:size=12
font-bold=BlexMono Nerd Font Mono:weight=bold:size=12
font-italic=BlexMono Nerd Font Mono:slant=italic:size=12
font-bold-italic=BlexMono Nerd Font Mono:weight=bold:slant=italic:size=12
pad=10x10 center
initial-window-size-chars=110x30
dpi-aware=no

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}

[colors]
# Translucent background, opaque text (like ghostty background-opacity)
alpha=0.88

# TokyoNight Storm
foreground=c0caf5
background=24283b
cursor=24283b c0caf5
selection-foreground=c0caf5
selection-background=364a82
urls=73daca

regular0=1d202f
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

bright0=4e5575
bright1=ff899d
bright2=9fe044
bright3=faba4a
bright4=8db0ff
bright5=c7a9ff
bright6=a4daff
bright7=c0caf5

16=ff9e64
17=db4b4b

jump-labels=1d202f e0af68
scrollback-indicator=1d202f 7aa2f7
search-box-no-match=1d202f f7768e
search-box-match=1d202f e0af68

[csd]
font=BlexMono Nerd Font Mono
color=c0caf5
button-color=24283b
