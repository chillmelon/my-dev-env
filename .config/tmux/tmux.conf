# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin "arcticicestudio/nord-tmux"
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'tmux-plugins/tmux-continuum'   # keep LAST, after any theme/status plugin

set -g @continuum-save-interval '15'   # minutes (0 = disable autosave)
set -g @continuum-restore 'on'        # auto-restore when the tmux server starts

# optional extras
set -g @resurrect-capture-pane-contents 'on'   # save the text shown in each pane
set -g @resurrect-strategy-nvim 'session'      # restore nvim sessions (needs Session.vim / vim-obsession)

# Change prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
set -ga update-environment " WAYLAND_DISPLAY SWAYSOCK XDG_SESSION_TYPE"

# vi key movement for copy/pasta mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind r source-file $HOME/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Git worktree workflow (-EE: popup stays open on error so the message is visible)
bind W display-popup -EE -w 80% -h 60% -d '#{pane_current_path}' '~/.local/scripts/worktree-add'
bind X display-popup -EE -w 80% -h 40% -d '#{pane_current_path}' '~/.local/scripts/worktree-done'

# Split panes
bind C-v split-window -h  # Vertical split
bind C-h split-window -v  # Horizontal split

 # Use Alt + hjkl to navigate between panes
bind h select-pane -L  # Move left
bind j select-pane -D  # Move down
bind k select-pane -U  # Move up
bind l select-pane -R  # Move right
bind / select-pane -l  # Move last
 
# 判斷目前 pane 是否正在執行 Vim / Neovim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
        | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# 在 Neovim 裡就轉送按鍵，否則切換 tmux pane
        bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
        bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
        bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
        bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# tmux 的 vi copy mode 中也能切換 pane
        bind-key -T copy-mode-vi M-h select-pane -L
        bind-key -T copy-mode-vi M-j select-pane -D
        bind-key -T copy-mode-vi M-k select-pane -U
        bind-key -T copy-mode-vi M-l select-pane -R

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

